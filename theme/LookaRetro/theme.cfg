name: LookaRetro
version: 1.0
author: LookaRetro
summary: Dark neon console UI for turning a Mac into a retro game console
description: >
  A clean, gamepad-first two-level launcher for Pegasus Frontend.
  Pick a system, then pick a game, with a blurred-screenshot backdrop,
  box-art grid and a detail panel. Navigate with the D-pad, launch with A,
  go back with B, and open settings with START.
keywords: retro, console, 10foot, neon, dark
