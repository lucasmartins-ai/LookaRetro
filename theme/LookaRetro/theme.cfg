name: LookaRetro
version: 1.3
author: LookaRetro (lookadev.com)
summary: Nintendo pixel-art + "Senhor dos Anéis" retro console UI (Centro de Seleção Redesenhado + Saída Segura)
description: >
  Tema retrô em pixel-art para Pegasus Frontend, com estética de Nintendo
  8/16-bit e Senhor dos Anéis: ouro do Um Anel, verde do Condado, tons de
  Mordor, scanlines de CRT e a marca LookaDev no topo. Centro de seleção
  com halo dourado de alto contraste, paginação de sistemas, navegação
  por controle e mouse, e diálogo de saída seguro sem risco de desligar o PC.
keywords: retro, pixel, 8bit, nintendo, lotr, console, 10foot, senhor dos aneis
