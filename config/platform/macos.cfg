# LookaRetro — RetroArch platform driver snippet (macOS / Apple Silicon)
# Appended to the shared config by install-macos.sh.
#
# NOTE (2026-08): video_driver is "sdl2", not "metal", on purpose.
# The `metal` driver on macOS 26 freezes RetroArch ~10s after load (its
# "draw observer" stops scheduling runloop_iterate; all threads go idle and
# the game hangs, no crash/error). Confirmed under RetroArch 1.22.2 with
# Snes9x/Gambatte/mGBA/Mupen64Plus-Next/melonDS, across every combination of
# vsync/hard-sync/run-ahead/refresh-rate/waitable-swapchains.
# `sdl2` runs the 2D cores stably. Do NOT set video_threaded=true on macOS —
# it crashes at startup (Metal init off the main thread is unsupported).
video_driver = "sdl2"
audio_driver = "coreaudio"
video_windowed_fullscreen = "true"
