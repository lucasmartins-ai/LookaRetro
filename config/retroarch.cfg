# LookaRetro — RetroArch shared config (cross-platform)
# Tuned for low input lag. Platform-specific video/audio drivers are appended
# by each installer from config/platform/<os>.cfg.
# See docs/TUNING.md for the reasoning behind each block.

# ---- Video --------------------------------------------------------------
video_fullscreen = "true"
video_vsync = "true"
# Hard GPU Sync minimises the GPU-side latency queue.
video_hard_sync = "true"
video_hard_sync_frames = "0"
video_frame_delay = "0"
# Threaded video adds a frame of latency — keep it OFF for responsiveness.
video_threaded = "false"
# Crisp, integer-scaled pixels for 2D systems (per-core can override).
video_smooth = "false"
video_scale_integer = "true"
video_scale_integer_overscale = "false"
video_aspect_ratio_auto = "true"
video_crop_overscan = "true"
video_font_enable = "true"
video_gpu_record = "false"

# ---- Audio --------------------------------------------------------------
audio_out_rate = "48000"
audio_sync = "true"
audio_resampler = "sinc"
audio_latency = "64"
audio_max_timing_skew = "0.05"
audio_rate_control_delta = "0.005"

# ---- Input --------------------------------------------------------------
input_autodetect_enable = "true"
# Menu toggle: L3+R3 (combo value 2). Change in Settings > Input > Hotkeys.
input_menu_toggle_gamepad_combo = "2"
# Two-player console: fix player slots by connect order (0 = primeiro pad
# detectado, 1 = segundo). Xbox pads (Series/One) are in RetroArch's built-in
# autoconfig DB — no remap needed; button layout matches the Nintendo diamond.
input_player1_joypad_index = "0"
input_player2_joypad_index = "1"

# ---- Latency ------------------------------------------------------------
# Run-ahead is enabled per-core (only the cores that support it reliably).
run_ahead_enabled = "false"
run_ahead_frames = "1"
run_ahead_secondary_instance = "false"
run_ahead_hide_warnings = "false"

# ---- Behaviour / UI -----------------------------------------------------
# Quit RetroArch entirely when "Close Content" is used, so control returns
# to Pegasus Frontend. (Config-file-only key.)
quit_on_close_content = "true"
pause_nonactive = "false"
menu_driver = "ozone"
content_show_add = "false"
content_show_favorites = "true"
content_show_history = "true"
content_show_playlists = "true"
content_show_netplay = "false"
menu_show_online_updater = "true"
playlist_show_core_name = "true"

# ---- Misc ---------------------------------------------------------------
menu_crash_logging = "true"
rgui_show_start_screen = "false"
fastforward_ratio = "0.0"
