# LookaRetro — per-core override: Snes9x (Super Nintendo)
# Run-ahead disabled (2026-08): robust combo with the macOS `sdl2` driver
# (the metal driver freezes ~10s after load on macOS 26). See macos.cfg.
run_ahead_enabled = "false"
run_ahead_frames = "1"
run_ahead_secondary_instance = "false"
# Integer scaling for crisp pixels.
video_scale_integer = "true"
video_smooth = "false"
