# LookaRetro — per-core override: Gambatte (Game Boy / Game Boy Color)
# Gambatte has excellent run-ahead support and very low latency.
# Run-ahead disabled (2026-08): robust combo with the macOS `sdl2` driver.
# See config/platform/macos.cfg.
run_ahead_enabled = "false"
run_ahead_frames = "1"
run_ahead_secondary_instance = "false"
video_scale_integer = "true"
video_smooth = "false"
