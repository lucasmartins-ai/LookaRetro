# LookaRetro — per-core override: Mupen64Plus-Next (Nintendo 64)
#
# Video on macOS: the core's default GLideN64 plugin breaks under macOS's
# OpenGL core profile (audio plays, screen stays black). The RDP plugin is
# switched to ParaLLEl-RDP (Vulkan/MoltenVK, GPU-accelerated) via the core
# options file (Mupen64Plus-Next.opt, deployed alongside this one) — fall back
# to "angrylion" (software) for any game that misbehaves. Run-ahead is not
# supported here; low latency comes from hard GPU sync. No CPU dynarec on
# macOS builds, so the GPU RDP is the main speed lever.
video_scale_integer = "false"
video_smooth = "true"
