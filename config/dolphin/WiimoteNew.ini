# LookaRetro — emulated Wii Remotes (players 1 & 2) mapped to Xbox controllers.
# Layout: A/A, B/B, 1/X, 2/Y, -/Back, +/Start, Home/Guide, D-Pad = pad,
# Pointer (IR) = right stick, Shake = flick left stick. Extension: None.
# SDL/0 = primeiro pad, SDL/1 = segundo. Jogos com Nunchuk: ajuste em
# Controllers > Wii Remote > Emulated > Extension (ou use o perfil "Standard").

[Wiimote1]
Device = SDL/0/Gamepad
Source = Emulated
Extension = None
Buttons/A = `Button A`
Buttons/B = `Button B`
Buttons/1 = `Button X`
Buttons/2 = `Button Y`
Buttons/- = `Button Back`
Buttons/+ = `Button Start`
Buttons/Home = `Button Guide`
D-Pad/Up = `Pad N`
D-Pad/Down = `Pad S`
D-Pad/Left = `Pad W`
D-Pad/Right = `Pad E`
IR/Up = `Right Y-`
IR/Down = `Right Y+`
IR/Left = `Right X-`
IR/Right = `Right X+`
Shake/X = `Left X-` | `Left X+`
Shake/Y = `Left Y-` | `Left Y+`
Shake/Z = `Left Y+` | `Left Y-`

[Wiimote2]
Device = SDL/1/Gamepad
Source = Emulated
Extension = None
Buttons/A = `Button A`
Buttons/B = `Button B`
Buttons/1 = `Button X`
Buttons/2 = `Button Y`
Buttons/- = `Button Back`
Buttons/+ = `Button Start`
Buttons/Home = `Button Guide`
D-Pad/Up = `Pad N`
D-Pad/Down = `Pad S`
D-Pad/Left = `Pad W`
D-Pad/Right = `Pad E`
IR/Up = `Right Y-`
IR/Down = `Right Y+`
IR/Left = `Right X-`
IR/Right = `Right X+`
Shake/X = `Left X-` | `Left X+`
Shake/Y = `Left Y-` | `Left Y+`
Shake/Z = `Left Y+` | `Left Y-`
