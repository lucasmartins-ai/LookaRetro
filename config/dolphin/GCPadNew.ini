# LookaRetro — GameCube pads (players 1 & 2) mapped to Xbox controllers via the
# bundled "SDL Gamepad" profile (A/B/X/Y, sticks, triggers, d-pad, rumble).
# SDL/0 = primeiro pad detectado, SDL/1 = segundo. Edit inside Dolphin GUI if
# your connect order differs (Controllers > GameCube > Port 1 > Device).

[GCPad1]
Device = SDL/0/Gamepad
Profile = SDL Gamepad

[GCPad2]
Device = SDL/1/Gamepad
Profile = SDL Gamepad
